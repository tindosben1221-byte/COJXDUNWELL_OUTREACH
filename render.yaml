# Render Blueprint for Dunwell Youth Clinic & City of Johannesburg Outreach
services:
  - type: web
    name: coj-dunwell-outreach
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyD-T-f7pI4EYamginTshu7Tc00P16dFdmE
      - key: VITE_FIREBASE_PROJECT_ID
        value: buoyant-achievment-4lxdt
      - key: VITE_FIREBASE_APP_ID
        value: 1:851147240403:web:e6019f23a453bfb9277526
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: buoyant-achievment-4lxdt.firebaseapp.com
      - key: VITE_FIREBASE_DATABASE_ID
        value: ai-studio-cojxdunwelloutre-f1d464a2-fd65-4bf9-84d8-a9b3abd9ea86
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: buoyant-achievment-4lxdt.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "851147240403"
